{% extends "base.html" %}

{% block title %}Lecturer Login | CUZ QR Attendance{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-banner">
        <span class="eyebrow">Cavendish Attendance</span>
        <div class="auth-logo-box">L</div>
        <h1>Lecturer Login</h1>
        <p>Secure Lecturer Login</p>
    </div>

    <form class="form-grid auth-card" method="POST">
        <label>
            Username
            <input type="text" name="username" placeholder="Enter username" autocomplete="username" required>
        </label>

        <label>
            Password
            <input type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
        </label>

        <button type="submit">Login</button>
        <p class="muted center-text">Need an account? <a href="{{ url_for('register') }}">Create one</a></p>
    </form>
</section>
{% endblock %}
